name: Breaking news (hourly)
# Hourly schedule enabled (user-approved 16 Oct 2026). Also runnable via "Run workflow".
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
concurrency: { group: news, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch RSS headlines
        run: python scripts/fetch_news.py
      - name: Commit data/news.json if changed
        run: |
          if git diff --quiet -- data/news.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "news: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2; do
            git pull --rebase origin main && git push && exit 0
            echo "push failed, retrying"; sleep 5
          done
          exit 1
