name: Breaking news + prices (hourly)
# Hourly at :17 (off-peak; :00 runs were being dropped by GitHub). User-approved 16 Oct 2026.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency: { group: news, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch RSS headlines
        run: python scripts/fetch_news.py
        continue-on-error: true
      - name: Install Playwright (uses the runner's preinstalled Google Chrome)
        run: pip install --quiet playwright
        continue-on-error: true
      - name: Fetch prices (Yahoo chart API)
        run: python scripts/fetch_prices.py
        continue-on-error: true
      - name: Fetch early warning signals
        run: python scripts/fetch_signals.py
        continue-on-error: true
      - name: Commit data/news.json + data/prices.json + data/signals.json if changed (single commit)
        run: |
          git add -N data/prices.json data/signals.json 2>/dev/null || true
          if git diff --quiet -- data/news.json data/prices.json data/signals.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json; git add data/prices.json data/signals.json 2>/dev/null || true
          git commit -m "news+prices+signals: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2; do
            git pull --rebase origin main && git push && exit 0
            echo "push failed, retrying"; sleep 5
          done
          exit 1
