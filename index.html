try{(function(){
const LM=D.live;if(!LM)return;const Q={};
const ict=t=>new Date(Date.parse(t)+7*3600e3).toISOString().slice(11,16);
const day=t=>{const a=new Date(Date.parse(t)+7*3600e3).toISOString().slice(0,10),b=new Date(Date.now()+7*3600e3).toISOString().slice(0,10);return a==b?'':new Date(Date.parse(t)+7*3600e3).toISOString().slice(8,10)+'/'+new Date(Date.parse(t)+7*3600e3).toISOString().slice(5,7)+' '};
const c0=v=>v.toLocaleString('en-US',{maximumFractionDigits:0}),c2=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const F={spx:v=>c0(v),dow:v=>c0(v),ndq:v=>c0(v),y10:v=>v.toFixed(2)+'%',wti:v=>'$'+v.toFixed(2),brent:v=>'$'+v.toFixed(2),gold:v=>'$'+c0(v),btc:v=>'$'+c0(v),eth:v=>'$'+c0(v),set:v=>c2(v),thb:v=>v.toFixed(2)};
const put=(k,v,chg,t,src,prev)=>{if(typeof v!='number'||!isFinite(v))return;if(Q[k]&&Date.parse(Q[k].t)>Date.parse(t))return;Q[k]={v,chg,t,src,prev}};
const bp=q=>typeof q.prev=='number'?(q.v-q.prev)*100:(typeof q.chg=='number'?(q.v-q.v/(1+q.chg/100))*100:null);
const CH=(k,q)=>k=='y10'?bp(q):q.chg;
const chgTxt=(c,k)=>typeof c!='number'?'':k=='y10'?(c>0?'+':'')+c.toFixed(1)+' bp':(c>0?'+':'')+c.toFixed(2)+'%';
const cls=c=>typeof c!='number'||Math.abs(c)<1e-9?'zero':c>0?'up':'dn';
function apply(){
 let newest=0;
 document.querySelectorAll('#tick > span').forEach(sp=>{const b=sp.querySelector('b'),k=b&&LM.ticker[b.textContent];const q=Q[k];if(!q)return;
  sp.childNodes[1].textContent=' '+F[k](q.v)+' ';const c=sp.querySelector('span');if(c){const ch=CH(k,q);c.className=cls(ch);c.innerHTML=chgTxt(ch,k)+` <small class=lvt>${day(q.t)+ict(q.t)}</small>`}});
 if(Q.eth&&!document.querySelector('#tick .eth')){const h=`<span class=eth><b>ETH</b> ${F.eth(Q.eth.v)} <span class="${cls(Q.eth.chg)}">${chgTxt(Q.eth.chg)}</span></span>`;const tk=$('tick');const n=tk.children.length/2;tk.children[n-1].insertAdjacentHTML('afterend',h);tk.lastElementChild.insertAdjacentHTML('afterend',h)}
 document.querySelectorAll('.num').forEach(n=>{const k=LM.nums[n.querySelector('b').textContent],q=Q[k];if(!q)return;const v=n.querySelector('.v'),ch=CH(k,q),up=typeof ch!='number'||Math.abs(ch)<1e-9?0:ch>0?1:-1;
  v.className='v '+(up>0?'up':up<0?'dn':'');v.textContent=(up>0?'▲ ':up<0?'▼ ':'■ ')+F[k](q.v);const sm=n.querySelector('small');if(sm){sm.className='r';sm.innerHTML=(chgTxt(ch,k)?`<span class=${cls(ch)}>${chgTxt(ch,k)}</span> `:'')+`<span class=lvt>${day(q.t)+ict(q.t)}</span>`}});
 const scope=[...document.querySelectorAll('main section')].filter(s=>s.querySelector('.badge'));
 for(const k in LM.text){const q=Q[k];if(!q)continue;
  let el=document.querySelector('.lv[data-k='+k+']');
  if(!el){const base=LM.text[k];for(const s of scope){const w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT);let tn;while(tn=w.nextNode()){const i=tn.nodeValue.indexOf(base);if(i<0)continue;const r=tn.splitText(i);r.splitText(base.length);el=document.createElement('span');el.className='lv';el.dataset.k=k;r.parentNode.replaceChild(el,r);const tm=document.createElement('span');tm.className='lvwrap';el.after(tm);const li=el.closest('li');if(li)li.querySelectorAll('span.up,span.dn').forEach(x=>{if(x!==el&&!x.closest('.lvwrap'))x.remove()});break}if(el)break}}
  if(el){el.textContent=F[k](q.v);el.title=(q.src||'')+' · '+day(q.t)+ict(q.t)+' ICT';const ch=CH(k,q);el.nextSibling.innerHTML=(chgTxt(ch,k)?`<span class="lvc ${cls(ch)}">${chgTxt(ch,k)}</span>`:'')+`<span class=lvt>· ${day(q.t)+ict(q.t)}</span>`}}
 for(const k in Q)newest=Math.max(newest,Date.parse(Q[k].t));
 if(newest){$('livet').textContent='updated '+ict(new Date(newest).toISOString())+' ICT';$('live').style.display='inline-flex'}
}
const J=(u)=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw r.status;return r.json()});
function server(){return J('data/prices.json?v=VER_20261029070234&t='+Date.now()).then(P=>{for(const k in P.q){const q=P.q[k];put(k,q.v,q.chg,q.t,q.src+(q.stale?' (last good)':''),q.prev)}}).catch(()=>{})}
function client(){return Promise.all([
 J('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true').then(c=>{const iso=s=>new Date(s*1000).toISOString();put('btc',c.bitcoin.usd,c.bitcoin.usd_24h_change,iso(c.bitcoin.last_updated_at),'CoinGecko');put('eth',c.ethereum.usd,c.ethereum.usd_24h_change,iso(c.ethereum.last_updated_at),'CoinGecko')}).catch(()=>{}),
 J('https://api.gold-api.com/price/XAU').then(g=>put('gold',g.price,null,g.updatedAt,'gold-api.com spot')).catch(()=>{}),
 J('https://open.er-api.com/v6/latest/USD').then(f=>put('thb',f.rates.THB,null,new Date(f.time_last_update_unix*1000).toISOString(),'open.er-api.com')).catch(()=>{})])}

run();setInterval(()=>{if(!document.hidden)run()},60000);

})()}catch(e){ERR(e)}
try{(function(){const G=D.glossary||{},tt=document.createElement('div');tt.id='tt';document.body.appendChild(tt);
const mk=k=>`<i class=tip data-k="${k}" tabindex=0 aria-label="info">ⓘ</i>`;
document.querySelectorAll('main li, main td:first-child, main h2').forEach(el=>{if(el.querySelector('.tip')||el.closest('.dtbl'))return;const txt=el.childNodes[0]&&el.tagName=='H2'?el.childNodes[0].textContent:el.textContent;let add='';
 for(const k in G){if(!G[k].m)continue;if(new RegExp(G[k].m).test(txt)){add=mk(k);break}}
 if(!add)return;const tgt=el.tagName=='H2'?null:el.querySelector('div.r');if(el.tagName=='H2'){const b=el.querySelector('.badge');b?b.insertAdjacentHTML('beforebegin',add):el.insertAdjacentHTML('beforeend',add)}else if(tgt)tgt.insertAdjacentHTML('beforebegin',add);else el.insertAdjacentHTML('beforeend',add)});

let cur=null;const show=e=>{const k=e.dataset.k;if(!G[k])return;tt.textContent=G[k].d;tt.style.display='block';const r=e.getBoundingClientRect(),w=tt.offsetWidth,h=tt.offsetHeight;let x=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12),y=r.bottom+8;if(y+h>innerHeight-12)y=r.top-h-8;tt.style.left=x+'px';tt.style.top=Math.max(12,y)+'px';cur=e},hide=()=>{tt.style.display='none';cur=null};
const hover=matchMedia('(hover:hover)').matches;
document.addEventListener('mouseover',e=>{if(hover&&e.target.classList.contains('tip'))show(e.target)});
document.addEventListener('mouseout',e=>{if(hover&&e.target.classList.contains('tip'))hide()});
document.addEventListener('click',e=>{const t=e.target.closest('.tip');if(t){e.preventDefault();cur===t?hide():show(t)}else hide()});
addEventListener('scroll',hide,{passive:true})})()}catch(e){ERR(e)}
requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('.needle').forEach(n=>n.style.transform=`rotate(${n.dataset.s*1.8}deg)`);document.querySelectorAll('.score').forEach(e=>{const t=+e.dataset.s;let n=0;const iv=setInterval(()=>{n=Math.min(t,n+t/40);e.textContent=Math.round(n);if(n>=t)clearInterval(iv)},40)})},200));
</script></body></html>
