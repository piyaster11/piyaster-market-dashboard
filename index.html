<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#000000"><meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<link rel=apple-touch-icon href="icon.svg"><link rel=icon href="icon.svg">
<title>Piyaster 99/99 Market Update</title>
<style>
:root{--a:#ff9f1c;--g:#19e07a;--r:#ff4d4d;--b:#000;--c:#0d0d0d;--l:#262626;--t:#e8e8e8;--m:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mono,.tick,.val{font-family:ui-monospace,Menlo,Consolas,monospace}
header{padding:16px;border-bottom:2px solid var(--a)}h1{margin:0;color:var(--a);font:700 22px ui-monospace,Menlo,monospace;letter-spacing:1px}
.asof{color:var(--m);font-size:13px}.tape{overflow:hidden;background:#111;border-bottom:1px solid var(--l);white-space:nowrap}
.tick{display:inline-block;padding:10px 0;animation:s 40s linear infinite}.tick span{margin-right:28px;font-size:14px}.tick b{color:var(--a)}
@keyframes s{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{max-width:1100px;margin:auto;padding:12px;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){main{grid-template-columns:repeat(2,1fr)}.wide{grid-column:1/-1}}
.card{background:var(--c);border:1px solid var(--l);border-left:3px solid var(--a);border-radius:6px;padding:14px 16px}
h2{margin:0 0 8px;color:var(--a);font:700 14px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;gap:8px}
ul{margin:0;padding-left:18px}li{margin:6px 0}.up{color:var(--g)}.dn{color:var(--r)}
.badge{font-size:12px;padding:4px 10px;border-radius:4px;white-space:nowrap}.BULLISH{background:#0b3d22;color:var(--g)}.MILDLY{background:#123a26;color:#7fe3a9}.NEUTRAL{background:#3a2c0b;color:var(--a)}.BEARISH{background:#3d0b0b;color:var(--r)}
.bottom{font-size:17px}.gauge{display:block;margin:auto;max-width:340px;width:100%}
.score{text-align:center;font:700 44px ui-monospace,Menlo,monospace;margin-top:-56px}.band{text-align:center;color:var(--a);font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-top:1px solid var(--l);vertical-align:top}td.val{text-align:right;white-space:nowrap}
.r{color:var(--m);font-size:12px}.disc{color:var(--m);font-size:12px;margin-top:10px}
.bands{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:11px;margin:6px 0}.bands span{padding:3px 8px;border-radius:3px;background:#1a1a1a}
footer{text-align:center;color:var(--m);font-size:13px;padding:20px}
</style></head><body>
<header><h1>PIYASTER 99/99 MARKET UPDATE</h1><div class="asof mono" id=asof></div></header>
<div class=tape><div class=tick id=tick></div></div>
<main id=main></main>
<footer>Not financial advice. · Piyaster 99/99</footer>
<script src="data.js"></script>
<script>
const D=window.DASH,$=s=>document.getElementById(s);
$('asof').textContent='As of '+D.asOf;
const t=D.ticker.map(x=>`<span><b>${x[0]}</b> ${x[1]} <span class="${x[3]?'up':''}">${x[2]}</span></span>`).join('');$('tick').innerHTML=t+t;
let h=`<section class="card wide"><h2>Bottom Line</h2><div class=bottom>${D.bottom}</div></section>`;
D.assets.forEach(a=>h+=`<section class=card><h2>${a.n}<span class="badge ${a.s.split(' ')[0]}">${a.s}</span></h2><ul class=val style="text-align:left">${a.l.map(i=>`<li>${i}</li>`).join('')}</ul></section>`);
// nuclear meter
const score=Math.round(D.nuke.reduce((s,f)=>s+f[2]*f[3],0)*10)/10;
const bands=[[20,'Low','#19e07a'],[40,'Guarded','#c6e01a'],[60,'Elevated','#ff9f1c'],[80,'High','#ff6a1c'],[100,'Severe','#ff4d4d']];
const band=bands.find(b=>score<=b[0]);
let arcs='',p=0;bands.forEach(b=>{const a0=Math.PI*(1-p/100),a1=Math.PI*(1-b[0]/100);arcs+=`<path d="M${100+80*Math.cos(a0)} ${100-80*Math.sin(a0)} A80 80 0 0 1 ${100+80*Math.cos(a1)} ${100-80*Math.sin(a1)}" stroke="${b[2]}" stroke-width=16 fill=none opacity=.85 />`;p=b[0]});
h+=`<section class="card wide"><h2>Nuclear Escalation Risk Index</h2>
<svg class=gauge viewBox="0 0 200 115">${arcs}<line id=needle x1=100 y1=100 x2=30 y2=100 stroke="#fff" stroke-width=3 stroke-linecap=round style="transform-origin:100px 100px;transition:transform 1.6s cubic-bezier(.2,.8,.2,1)"/><circle cx=100 cy=100 r=6 fill="#fff"/></svg>
<div class=score id=score>0</div><div class=band>${band[1].toUpperCase()}</div>
<div class=bands>${bands.map((b,i)=>`<span style="color:${b[2]}">${i?bands[i-1][0]+1:0}-${b[0]} ${b[1]}</span>`).join('')}</div>
<table><tr><td class=r>Factor</td><td class="val r">Score × Wt</td></tr>${D.nuke.map(f=>`<tr><td><b>${f[0]}</b><div class=r>${f[1]}</div></td><td class=val>${f[2]} × ${f[3].toFixed(2)}<br><span class=r>= ${(f[2]*f[3]).toFixed(2)}</span></td></tr>`).join('')}
<tr><td><b>Weighted total</b></td><td class=val><b>${score}</b></td></tr></table>
<div class=disc>⚠️ Editorial indicator of escalation tension built from news factors. It is <b>not</b> a probability of nuclear war.</div></section>`;
D.sections.forEach(s=>h+=`<section class="card${s[0]=='Watch This Week'?' wide':''}"><h2>${s[0]}</h2><ul>${s[1].map(i=>`<li>${i}</li>`).join('')}</ul></section>`);
$('main').innerHTML=h;
requestAnimationFrame(()=>setTimeout(()=>{$('needle').style.transform=`rotate(${score*1.8}deg)`;let n=0;const iv=setInterval(()=>{n=Math.min(score,n+score/40);$('score').textContent=Math.round(n);if(n>=score)clearInterval(iv)},40)},200));
</script></body></html>
