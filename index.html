<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#000000"><meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<link rel=apple-touch-icon href="icon.svg"><link rel=icon href="icon.svg">
<title>Piyaster 99/99 Market Update</title>
<style>
:root{--a:#ff9f1c;--g:#19e07a;--r:#ff4d4d;--b:#000;--c:#0d0d0d;--l:#262626;--t:#e8e8e8;--m:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mono,.tick,.val{font-family:ui-monospace,Menlo,Consolas,monospace}
header{padding:16px;border-bottom:2px solid var(--a)}h1{margin:0;color:var(--a);font:700 22px ui-monospace,Menlo,monospace;letter-spacing:1px}
.asof{color:var(--m);font-size:13px}.tape{overflow:hidden;background:#111;border-bottom:1px solid var(--l);white-space:nowrap}
.tick{display:inline-block;padding:10px 0;animation:s 40s linear infinite}.tick span{margin-right:28px;font-size:14px}.tick b{color:var(--a)}
@keyframes s{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{max-width:1100px;margin:auto;padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){main{grid-template-columns:repeat(2,1fr)}.wide{grid-column:1/-1}}
.card{background:var(--c);border:1px solid var(--l);border-left:3px solid var(--a);border-radius:6px;padding:14px 16px}
h2{margin:0 0 8px;color:var(--a);font:700 14px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;gap:8px}
ul{margin:0;padding-left:18px}li{margin:6px 0}.up{color:var(--g)}.dn{color:var(--r)}
.badge{font-size:12px;padding:4px 10px;border-radius:4px;white-space:nowrap}.BULLISH{background:#0b3d22;color:var(--g)}.MILDLY{background:#123a26;color:#7fe3a9}.NEUTRAL{background:#3a2c0b;color:var(--a)}.BEARISH{background:#3d0b0b;color:var(--r)}
.bottom{font-size:17px}.gauge{display:block;margin:auto;max-width:340px;width:100%}
.score{text-align:center;font:700 44px ui-monospace,Menlo,monospace;margin-top:-8px}.band{text-align:center;color:var(--a);font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td{overflow-wrap:anywhere;padding:8px 4px;border-top:1px solid var(--l);vertical-align:top}td.val{text-align:right;white-space:nowrap}
.r{color:var(--m);font-size:12px}.disc{color:var(--m);font-size:12px;margin-top:10px}
.bands{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:11px;margin:6px 0}.meters{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}.bands span{padding:3px 8px;border-radius:3px;background:#1a1a1a}
.todo{background:#1f1400;border:1px solid var(--a);border-left:6px solid var(--a);border-radius:8px;padding:16px}.todo h2{font-size:15px}.todo li{margin:10px 0;font-size:16px}.todo .r{margin-top:8px}.tip{display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:var(--a);font-size:13px;margin-left:4px;min-width:24px;min-height:24px;cursor:help;vertical-align:middle;-webkit-tap-highlight-color:transparent}#tt{position:fixed;z-index:99;max-width:min(300px,calc(100vw - 24px));background:#1a1200;color:#f3e6cc;border:1px solid var(--a);border-radius:8px;padding:10px 12px;font:14px/1.45 -apple-system,Helvetica,sans-serif;box-shadow:0 6px 24px #000c;display:none;pointer-events:none}.lnk{color:#6fb3ff;font-size:12px;text-decoration:none;margin-left:4px;white-space:nowrap}.disc .lnk{white-space:normal}.lnk:hover{text-decoration:underline}.sum{border-left-color:#6fb3ff}.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.num{min-width:0;overflow-wrap:anywhere;background:#151515;border-radius:6px;padding:8px 4px;text-align:center;font-family:ui-monospace,Menlo,monospace}.num b{display:block;color:var(--m);font-size:11px;font-weight:400}.num .v{font-size:13px}.num small{font-size:11px}.ai{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){.ai{grid-template-columns:repeat(2,minmax(0,1fr))}}.ai h3{color:var(--a);font:700 13px ui-monospace,Menlo,monospace;margin:12px 0 4px}.chartwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}.chartwrap svg{display:block;width:100%;min-width:340px;height:auto}.hlvals{font-family:ui-monospace,Menlo,monospace;font-size:14px;margin:4px 0 8px}.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;border:1px solid var(--l);border-radius:6px}.dtbl{border-collapse:separate;border-spacing:0;min-width:640px;font-size:13px}.dtbl th{color:var(--a);font:600 11px ui-monospace,Menlo,monospace;text-align:left;padding:8px 6px;background:#111;white-space:nowrap}.dtbl td{padding:8px 6px;border-top:1px solid var(--l);white-space:nowrap}.dtbl .n{text-align:right;font-family:ui-monospace,Menlo,monospace}.dtbl .st{position:sticky;left:0;background:#0d0d0d;z-index:1;box-shadow:2px 0 0 #222}.dtbl th.st{background:#111}.dtbl a{color:#6fb3ff;text-decoration:none;font-weight:700}footer{text-align:center;color:var(--m);font-size:13px;padding:20px}
</style></head><body>
<header><h1>PIYASTER 99/99 MARKET UPDATE</h1><div class="asof mono" id=asof></div></header>
<div class=tape><div class=tick id=tick></div></div>
<main id=main></main>
<footer>Not financial advice. · Piyaster 99/99</footer>
<script src="data.js"></script>
<script>
const LI=x=>typeof x=='string'?x:x.t+(x.src||[]).map(s=>` <a class=lnk href="${s[1]}" target=_blank rel=noopener>↗ ${s[0]}</a>`).join(''),UL=a=>`<ul>${a.map(i=>`<li>${LI(i)}</li>`).join('')}</ul>`;
const D=window.DASH,$=s=>document.getElementById(s);
$('asof').textContent='As of '+D.asOf;
const t=D.ticker.map(x=>`<span><b>${x[0]}</b> ${x[1]} <span class="${x[3]?'up':''}">${x[2]}</span></span>`).join('');$('tick').innerHTML=t+t;
let h=D.summary?`<section class="card wide sum"><h2>Key Market Summary</h2>${UL(D.summary.l)}<div class=nums>${D.summary.nums.map(n=>`<div class=num><b>${n[0]}</b><span class="v ${n[3]>0?'up':n[3]<0?'dn':''}">${n[3]>0?'▲':n[3]<0?'▼':'■'} ${n[1]}</span><br><small class=r>${n[2]}</small></div>`).join('')}</div></section>`:'';h+=D.todo?`<section class="todo wide"><h2>⚡ ${D.todo.title}</h2><ul>${D.todo.l.map(i=>`<li>${i}</li>`).join('')}</ul><div class=r>${D.todo.note}</div></section>`:'';h+=`<section class="card wide"><h2>Bottom Line</h2><div class=bottom>${D.bottom}</div></section>`;
const A=()=>D.assets.forEach(a=>h+=`<section class=card><h2>${a.n}<span class="badge ${a.s.split(' ')[0]}">${a.s}</span></h2><ul class=val style="text-align:left">${a.l.map(i=>`<li>${LI(i)}</li>`).join('')}</ul></section>`);

function gauge(id,title,score,bands,label,rows,head,disc){let arcs='',p=0;bands.forEach(b=>{const a0=Math.PI*(1-p/100),a1=Math.PI*(1-b[0]/100);arcs+=`<path d="M${100+80*Math.cos(a0)} ${100-80*Math.sin(a0)} A80 80 0 0 1 ${100+80*Math.cos(a1)} ${100-80*Math.sin(a1)}" stroke="${b[2]}" stroke-width=16 fill=none opacity=.85 />`;p=b[0]});
const band=bands.find(b=>score<=b[0]);
return `<section class=card><h2>${title}</h2><svg class=gauge viewBox="0 0 200 115">${arcs}<line class=needle data-s="${score}" x1=100 y1=100 x2=48 y2=100 stroke="#fff" stroke-width=3 stroke-linecap=round style="transform-origin:100px 100px;transition:transform 1.6s cubic-bezier(.2,.8,.2,1)"/><circle cx=100 cy=100 r=6 fill="#fff"/></svg>
<div class=score data-s="${score}">0</div><div class=band style="color:${band[2]}">${band[1].toUpperCase()}</div>
<div class=bands>${bands.map((b,i)=>`<span style="color:${b[2]}">${i?bands[i-1][0]+1:0}-${b[0]} ${b[1]}</span>`).join('')}</div>
<table><tr><td class=r>${head[0]}</td><td class="val r">${head[1]}</td></tr>${rows}</table><div class=disc>${disc}</div></section>`}
const nscore=Math.round(D.nuke.reduce((s,f)=>s+f[2]*f[3],0)*10)/10;
const F=D.fg,fgB=[[25,'Extreme Fear','#ff4d4d'],[45,'Fear','#ff6a1c'],[55,'Neutral','#ff9f1c'],[75,'Greed','#c6e01a'],[100,'Extreme Greed','#19e07a']];
h+=`<div class="wide meters">`+gauge('fg','Market Sentiment · Fear &amp; Greed',F.score,fgB,'',F.comp.map(c=>`<tr><td>${c[0]}</td><td class=val>${c[1]}<br><span class=r>${c[2]}</span></td></tr>`).join('')+`<tr><td class=r>Prev close / 1 wk / 1 mo</td><td class=val>${F.prev} / ${F.week} / ${F.month}</td></tr>`,['Component','Score'],'Source: <a class=lnk target=_blank rel=noopener href="'+F.url+'">'+F.src+' ↗</a>')
+gauge('nk','Nuclear Escalation Risk Index',nscore,[[20,'Low','#19e07a'],[40,'Guarded','#c6e01a'],[60,'Elevated','#ff9f1c'],[80,'High','#ff6a1c'],[100,'Severe','#ff4d4d']],'',D.nuke.map(f=>`<tr><td><b>${f[0]}</b><div class=r>${f[1]}</div></td><td class=val>${f[2]} × ${f[3].toFixed(2)}<br><span class=r>= ${(f[2]*f[3]).toFixed(2)}</span></td></tr>`).join('')+`<tr><td><b>Weighted total</b></td><td class=val><b>${nscore}</b></td></tr>`,['Factor','Score × Wt'],'⚠️ Editorial indicator of escalation tension built from news factors. It is <b>not</b> a probability of nuclear war.')+`</div>`;
A();
h+=`<section class="card wide"><h2>Bloomberg Radar</h2>${UL(D.radar)}</section>`;
h+=`<section class="card wide"><h2>Thailand Macro &amp; SET<span class="badge ${D.thai.badge}">SET ${D.thai.badge}</span></h2>${UL(D.thai.l)}${D.thDiv?`<h2 style="margin-top:16px">Top 10 SET Dividend Stocks (${D.thDiv.years}) <i class=tip data-k=dy tabindex=0>ⓘ</i></h2><div class=tblwrap><table class=dtbl><tr><th class=st>#&nbsp;Ticker</th><th class=n>5y avg yield</th><th class=n>5y avg DPS ฿</th><th class=n>Current yield</th><th class=n>Price ฿</th><th>Company</th><th>Sector</th></tr>${D.thDiv.rows.map((r,i)=>`<tr><td class=st>${i+1}&nbsp;<a href="${r.url}" target=_blank rel=noopener>${r.t}</a></td><td class="n up">${r.y5.toFixed(2)}%</td><td class=n>${r.d5.toFixed(2)}</td><td class=n>${r.cy.toFixed(2)}%</td><td class=n>${r.px.toFixed(2)}</td><td>${r.n}</td><td>${r.s}</td></tr>`).join('')}</table></div><div class=disc><b>Not a recommendation.</b> ${D.thDiv.basis} ${D.thDiv.asOf}. Sources: ${D.thDiv.src.map(x=>`<a class=lnk target=_blank rel=noopener href="${x[1]}">↗ ${x[0]}</a>`).join(' ')}</div>`:''}<h2 style="margin-top:12px">Thai Watch List</h2><ul>${D.thai.watch.map(i=>`<li>${i}</li>`).join('')}</ul></section>`;
D.sections.forEach(s=>h+=`<section class="card${s[0]=='Watch This Week'?' wide':''}"><h2>${s[0]}</h2>${UL(s[1])}</section>`);
const col=(n,c)=>`<div><h2>${n}</h2><h3>What's trending</h3>${UL(c.trend)}<h3>Upcoming launches</h3>${UL(c.next)}<h3>What to check</h3>${UL(c.check)}</div>`;
if(D.ai)h+=`<section class="card wide"><h2>AI Watch</h2><div class=ai>${col('🇺🇸 US',D.ai.us)}${col('🇨🇳 China',D.ai.cn)}</div><div class=disc>${D.ai.note}</div></section>`;
h+='<section class="card wide" id=chart><h2>S&amp;P 500 vs NYSE Breadth</h2><div class=r>Loading chart…</div></section>';
$('main').innerHTML=h;


fetch('data/chart.json?'+Date.now()).then(r=>r.json()).then(C=>{
const S=C.spx,N=S.length,W=360,P=40,T=170,B=110,G=12,x=i=>4+i*(W-P-8)/(N-1);
const hi=Math.max(...S.map(r=>r[2])),lo=Math.min(...S.map(r=>r[3])),y=v=>8+(hi-v)/(hi-lo)*(T-16);
let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1=0 x2=${W-P} y1=${y(v)} y2=${y(v)} stroke=#222 /><text x=${W-P+3} y=${y(v)+3} fill=#777 font-size=8>${Math.round(v)}</text>`}
let bars=S.map((r,i)=>{const c=r[4]>=r[1]?'#19e07a':'#ff4d4d',X=x(i);return `<path d="M${X} ${y(r[2])}V${y(r[3])}M${X-1.2} ${y(r[1])}H${X}M${X} ${y(r[4])}H${X+1.2}" stroke=${c} stroke-width=1 />`}).join('');
let months='';S.forEach((r,i)=>{if(i&&r[0].slice(5,7)!=S[i-1][0].slice(5,7))months+=`<text x=${x(i)} y=${T+B+G+10} fill=#777 font-size=8 text-anchor=middle>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+r[0].slice(5,7)-1]}</text><line x1=${x(i)} x2=${x(i)} y1=0 y2=${T+B+G} stroke=#1a1a1a />`});
const L=S[N-1],idx=Object.fromEntries(S.map((r,i)=>[r[0],i]));
const HL=C.hl.filter(r=>idx[r.d]!=null),m=Math.max(100,...HL.map(r=>Math.max(r.h,-r.l))),y0=T+G+B/2,ys=v=>y0-v/m*(B/2-4);
let hb=HL.map(r=>{const X=x(idx[r.d]);return `<rect x=${X-2.5} y=${ys(r.h)} width=5 height=${y0-ys(r.h)} fill=#19e07a /><rect x=${X-2.5} y=${y0} width=5 height=${ys(r.l)-y0} fill=#ff4d4d />`}).join('');
const LH=C.hl[C.hl.length-1];
const svg=`<svg viewBox="0 0 ${W} ${T+B+G+14}" font-family="ui-monospace,Menlo,monospace">${months}${g}${bars}
<rect x=${W-P+1} y=${y(L[4])-6} width=${P-1} height=12 fill=#ff9f1c /><text x=${W-P+3} y=${y(L[4])+3} fill=#000 font-size=8 font-weight=700>${L[4].toFixed(0)}</text>
<line x1=0 x2=${W-P} y1=${y0} y2=${y0} stroke=#444 /><text x=2 y=${T+G+8} fill=#19e07a font-size=8>NYSE new 52w highs</text><text x=2 y=${T+G+B-2} fill=#ff4d4d font-size=8>NYSE new 52w lows</text>${hb}
<text x=${W-P+3} y=${ys(LH.h)+3} fill=#19e07a font-size=8>${LH.h}</text><text x=${W-P+3} y=${ys(LH.l)+3} fill=#ff4d4d font-size=8>${LH.l}</text></svg>`;
const el=$('chart');el.innerHTML=`<h2>S&amp;P 500 vs NYSE Breadth <i class=tip data-k=hl tabindex=0>ⓘ</i></h2>
<div class=hlvals>SPX <b>${L[4].toLocaleString()}</b> (${L[0]}) · <span class=up>Highs ${LH.h}</span> / <span class=dn>Lows ${LH.l}</span> <span class=r>(${LH.d})</span></div>
<div class=chartwrap>${svg}</div>
<div class=disc>Daily OHLC bars, last ${N} sessions. Breadth bars only on days with a sourced value (${HL.map(r=>r.d.slice(5)).join(', ')}); history fills in as the daily refresh appends WSJ data. Sources: ${C.src.map(s=>`<a class=lnk target=_blank rel=noopener href="${s[1]}">↗ ${s[0]}</a>`).join(' ')} · 6 Oct value from StockCharts (user screenshot).</div>`;
}).catch(e=>{$('chart').innerHTML='<h2>S&amp;P 500 vs NYSE Breadth</h2><div class=r>Chart data unavailable.</div>'});
(function(){const G=D.glossary||{},tt=document.createElement('div');tt.id='tt';document.body.appendChild(tt);
const mk=k=>`<i class=tip data-k="${k}" tabindex=0 aria-label="info">ⓘ</i>`;
document.querySelectorAll('main li, main td:first-child, main h2').forEach(el=>{if(el.querySelector('.tip')||el.closest('.dtbl'))return;const txt=el.childNodes[0]&&el.tagName=='H2'?el.childNodes[0].textContent:el.textContent;let add='';
 for(const k in G){if(!G[k].m)continue;if(new RegExp(G[k].m).test(txt)){add=mk(k);break}}
 if(!add)return;const tgt=el.tagName=='H2'?null:el.querySelector('div.r');if(el.tagName=='H2'){const b=el.querySelector('.badge');b?b.insertAdjacentHTML('beforebegin',add):el.insertAdjacentHTML('beforeend',add)}else if(tgt)tgt.insertAdjacentHTML('beforebegin',add);else el.insertAdjacentHTML('beforeend',add)});
document.querySelectorAll('.badge').forEach(b=>{const t=b.textContent;b.insertAdjacentHTML('afterend',mk(/BULL/.test(t)?'bull':/BEAR/.test(t)?'bear':'neu'))});
document.querySelectorAll('.bands').forEach((b,i)=>b.insertAdjacentHTML('beforeend',mk(i?'nkbands':'fgbands')));
let cur=null;const show=e=>{const k=e.dataset.k;if(!G[k])return;tt.textContent=G[k].d;tt.style.display='block';const r=e.getBoundingClientRect(),w=tt.offsetWidth,h=tt.offsetHeight;let x=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12),y=r.bottom+8;if(y+h>innerHeight-12)y=r.top-h-8;tt.style.left=x+'px';tt.style.top=Math.max(12,y)+'px';cur=e},hide=()=>{tt.style.display='none';cur=null};
const hover=matchMedia('(hover:hover)').matches;
document.addEventListener('mouseover',e=>{if(hover&&e.target.classList.contains('tip'))show(e.target)});
document.addEventListener('mouseout',e=>{if(hover&&e.target.classList.contains('tip'))hide()});
document.addEventListener('click',e=>{const t=e.target.closest('.tip');if(t){e.preventDefault();cur===t?hide():show(t)}else hide()});
addEventListener('scroll',hide,{passive:true})})();
requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('.needle').forEach(n=>n.style.transform=`rotate(${n.dataset.s*1.8}deg)`);document.querySelectorAll('.score').forEach(e=>{const t=+e.dataset.s;let n=0;const iv=setInterval(()=>{n=Math.min(t,n+t/40);e.textContent=Math.round(n);if(n>=t)clearInterval(iv)},40)})},200));
</script></body></html>
